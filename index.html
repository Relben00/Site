<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="внешка.css">
</head>

<body class="bg-light">

<div class="container-fluid">
    <div class="row">

        <!-- Боковая панель -->
        <div class="col-lg-2 col-md-4 bg-white shadow-sm py-3 min-vh-100">

            <h5>Сортировка</h5>
            <button class="btn btn-primary w-100 mb-3" id="sortButton">Сортировка</button>

            <h5>Фильтр</h5>
            <button class="btn btn-info w-100 mb-3" id="filterButton">Фильтр</button>

            <h5>Категории</h5>
            <div class="list-group" id="categoryList">
                <a href="#" class="list-group-item list-group-item-action active" data-category="all">Все</a>
                <a href="#" class="list-group-item list-group-item-action" data-category="OF">OF</a>
                <a href="#" class="list-group-item list-group-item-action" data-category="Ph">Ph</a>
                <a href="#" class="list-group-item list-group-item-action" data-category="Азиатки">Азиатки</a>
            </div>

        </div>

        <!-- Основной контент -->
        <div class="col py-4">

            <header class="mb-4 d-flex justify-content-between align-items-center">
                <h1>Моя галерея</h1>
                <div class="d-flex gap-2">
                    <input type="text" class="form-control" id="searchBox" placeholder="Поиск...">
                    <button class="btn btn-success" id="addButton">Добавить</button>
                </div>
            </header>

            <main id="gallery" class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4"></main>

        </div>

    </div>
</div>

<script src="main.js"></script>

</body>
</html>
