<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Информация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">

    <button class="btn btn-secondary mb-3" onclick="goBack()">← Назад</button>

    <div id="content"></div>

</div>

<script>
function goBack() {
    window.location.href = "index.html";
}

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

let items = JSON.parse(localStorage.getItem("galleryItems")) || [];

const item = items.find(i => i.id === id);

const contentDiv = document.getElementById("content");

if (!item) {
    contentDiv.innerHTML = "<h3>Элемент не найден</h3>";
} else {

    contentDiv.innerHTML = `
        <div class="card">
            <img src="${item.imageUrl}" 
     		class="img-fluid mx-auto d-block"
     		style="max-width: 600px; height: auto;">
            <div class="card-body">
                <h3>${item.title}</h3>
                <textarea id="editContent" class="form-control mt-3" rows="6">
${item.content || ""}
                </textarea>
                <button class="btn btn-success mt-3" onclick="saveContent()">
                    Сохранить
                </button>
            </div>
        </div>
    `;
}

function saveContent() {
    const newText = document.getElementById("editContent").value;
    item.content = newText;

    localStorage.setItem("galleryItems", JSON.stringify(items));
    alert("Сохранено");
}
</script>

</body>
</html>
